<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="Quicksand, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .t   { fill:#444; font-size:13px; }
    .ts  { fill:#555; font-size:12px; }
    .ti  { fill:#555; font-size:12px; font-style:italic; }
    .h   { fill:#333; font-size:22px; font-weight:600; }
    .sub { fill:#666; font-size:14px; font-style:italic; }
    .pl  { font-size:17px; font-weight:600; font-style:italic; }
    .bx  { fill:#333; font-size:14px; font-weight:600; }
    .sym { fill:#333; font-size:34px; font-weight:700; }
    .symv{ fill:#333; font-size:30px; font-weight:700; }
    .new { fill:#7a4ea8; font-size:11px; font-weight:600; }
  </style>
  <defs>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9606e"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f7a5e"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7bd6"/></marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8912a"/></marker>
    <marker id="aX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>

  <rect width="1600" height="1010" fill="#ffffff"/>
  <line x1="815" y1="30" x2="815" y2="900" stroke="#bbb" stroke-dasharray="3 5"/>

  <!-- ===================== PANEL A ===================== -->
  <text x="340" y="52" class="h">A &#183; Transmission (host states)</text>
  <text x="340" y="78" class="sub">individual-based; each state summarises a host's lineages</text>

  <rect x="40" y="26" width="260" height="92" rx="16" fill="#e8eefc" stroke="#5b7bd6" stroke-width="1.5"/>
  <text x="58" y="52" fill="#3d5fc4" font-size="17px" font-weight="600">Importation (rate &#953;)</text>
  <text x="58" y="74" class="ts">Poisson rate, fixed count or single event</text>
  <text x="58" y="92" class="ti">v0.1: genotypes unrelated to local</text>
  <text x="58" y="108" class="ti">parasites (structured pool planned)</text>

  <rect x="30" y="140" width="770" height="400" rx="28" fill="#f7eaf2" stroke="#c9606e" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="52" y="170" class="pl" fill="#b04d5c">Humans</text>
  <text x="52" y="528" class="ti">no intrinsic incubation: blood stage starts at inoculation, so hosts are not SEI</text>

  <g>
    <rect x="110" y="200" width="150" height="90" fill="#fbf3f8" stroke="#c9606e" stroke-width="3"/>
    <text x="150" y="250" class="sym">S<tspan font-size="20px" dy="8">0</tspan></text>
    <text x="185" y="278" class="ts" text-anchor="middle">uninfected</text>

    <rect x="520" y="200" width="150" height="90" fill="#fbf3f8" stroke="#c9606e" stroke-width="3"/>
    <text x="568" y="250" class="sym">I<tspan font-size="20px" dy="8">0</tspan></text>
    <text x="595" y="278" class="ts" text-anchor="middle">blood stage only</text>

    <rect x="110" y="410" width="150" height="90" fill="#fbf3f8" stroke="#c9606e" stroke-width="3"/>
    <text x="150" y="460" class="sym">S<tspan font-size="20px" dy="8">L</tspan></text>
    <text x="185" y="488" class="ts" text-anchor="middle">hypnozoites only</text>

    <rect x="520" y="410" width="150" height="90" fill="#fbf3f8" stroke="#c9606e" stroke-width="3"/>
    <text x="568" y="460" class="sym">I<tspan font-size="20px" dy="8">L</tspan></text>
    <text x="595" y="488" class="ts" text-anchor="middle">blood stage + hypnozoites</text>
  </g>

  <line x1="262" y1="228" x2="516" y2="228" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="390" y="220" class="t" text-anchor="middle">bite, batch size 0 (&#955;<tspan font-size="10px" dy="3">h</tspan><tspan dy="-3"> + &#953;)</tspan></text>
  <line x1="518" y1="266" x2="264" y2="266" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="390" y="284" class="t" text-anchor="middle">recovery / blood-stage treatment</text>

  <line x1="262" y1="292" x2="516" y2="410" stroke="#555" stroke-width="2.5" marker-end="url(#aD)"/>
  <text transform="translate(392,344) rotate(24.9)" class="t" text-anchor="middle" font-weight="600">bite: primary + hypnozoite batch</text>

  <line x1="262" y1="438" x2="516" y2="438" stroke="#c9606e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aP)"/>
  <text x="390" y="430" class="t" text-anchor="middle" font-weight="600" style="fill:#b04d5c">relapse (&#945; per hypnozoite)</text>
  <line x1="518" y1="476" x2="264" y2="476" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="390" y="494" class="t" text-anchor="middle">recovery</text>

  <line x1="150" y1="292" x2="150" y2="406" stroke="#555" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#aD)"/>
  <text transform="translate(140,350) rotate(-90)" class="ts" text-anchor="middle">hyp.-only bite</text>
  <line x1="218" y1="408" x2="218" y2="294" stroke="#b8912a" stroke-width="2" marker-end="url(#aY)"/>
  <text transform="translate(234,350) rotate(-90)" class="ts" text-anchor="middle" style="fill:#8a6a14">reservoir cleared</text>

  <line x1="560" y1="292" x2="560" y2="406" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text transform="translate(550,350) rotate(-90)" class="ts" text-anchor="middle">superinfection</text>
  <text transform="translate(536,356) rotate(-90)" class="new" text-anchor="middle">gated by MAX_MOI</text>
  <line x1="628" y1="408" x2="628" y2="294" stroke="#b8912a" stroke-width="2" marker-end="url(#aY)"/>
  <text transform="translate(644,350) rotate(-90)" class="ts" text-anchor="middle" style="fill:#8a6a14">reservoir cleared</text>

  <path d="M672,428 C745,418 745,482 674,474" fill="none" stroke="#c9606e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aP)"/>
  <text x="737" y="402" class="ts" text-anchor="middle" style="fill:#b04d5c">relapse /</text>
  <text x="737" y="416" class="ts" text-anchor="middle" style="fill:#b04d5c">superinfection</text>

  <path d="M300,100 C360,108 385,150 390,200" fill="none" stroke="#5b7bd6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <path d="M300,112 C470,112 585,130 595,196" fill="none" stroke="#5b7bd6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <text x="408" y="162" fill="#3d5fc4" font-size="13px" font-style="italic">imports use the same</text>
  <text x="408" y="177" fill="#3d5fc4" font-size="13px" font-style="italic">bite outcomes</text>

  <rect x="30" y="600" width="770" height="280" rx="28" fill="#edf4eb" stroke="#4f7a5e" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="52" y="630" class="pl" fill="#4f7a5e">Mosquitoes</text>
  <text x="320" y="630" class="ti">(constant N; a dead mosquito is replaced by a susceptible one)</text>

  <rect x="90" y="690" width="140" height="80" fill="#f6faf5" stroke="#4f7a5e" stroke-width="3"/>
  <text x="137" y="740" class="symv">S<tspan font-size="18px" dy="8">v</tspan></text>
  <rect x="345" y="690" width="140" height="80" fill="#f6faf5" stroke="#4f7a5e" stroke-width="3"/>
  <text x="392" y="740" class="symv">E<tspan font-size="18px" dy="8">v</tspan></text>
  <rect x="600" y="690" width="140" height="80" fill="#f6faf5" stroke="#4f7a5e" stroke-width="3"/>
  <text x="652" y="740" class="symv">I<tspan font-size="18px" dy="8">v</tspan></text>

  <line x1="232" y1="730" x2="341" y2="730" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="287" y="752" class="t" text-anchor="middle">uptake</text>
  <text x="287" y="768" class="new" text-anchor="middle">cap MAX_BROODS_PER_MOSQ</text>
  <line x1="487" y1="730" x2="596" y2="730" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="541" y="722" class="t" text-anchor="middle">EIP</text>
  <text x="541" y="750" class="ts" text-anchor="middle">fixed 10 d</text>

  <path d="M415,780 C415,836 170,836 170,775" fill="none" stroke="#999" stroke-width="1.8" marker-end="url(#aX)"/>
  <path d="M670,772 C670,862 150,862 150,775" fill="none" stroke="#999" stroke-width="1.8" marker-end="url(#aX)"/>
  <text x="415" y="872" class="ts" text-anchor="middle">death &#956;<tspan font-size="9px" dy="3">v</tspan><tspan dy="-3"> &#8594; replaced as S</tspan><tspan font-size="9px" dy="3">v</tspan></text>

  <line x1="287" y1="542" x2="287" y2="724" stroke="#c9606e" stroke-width="2.5" marker-end="url(#aP)"/>
  <text x="298" y="566" class="t" style="fill:#b04d5c">&#955;<tspan font-size="10px" dy="3">v</tspan><tspan dy="-3">: bites on I</tspan><tspan font-size="10px" dy="3">0</tspan><tspan dy="-3"> / I</tspan><tspan font-size="10px" dy="3">L</tspan><tspan dy="-3"> with gametocytes</tspan></text>
  <line x1="670" y1="688" x2="670" y2="544" stroke="#4f7a5e" stroke-width="2.5" marker-end="url(#aG)"/>
  <text x="660" y="590" class="t" text-anchor="end" style="fill:#4f7a5e">&#955;<tspan font-size="10px" dy="3">h</tspan><tspan dy="-3">: infectious bites</tspan></text>

  <!-- ===================== PANEL B ===================== -->
  <text x="840" y="52" class="h">B &#183; Parasite lineage life cycle</text>
  <text x="840" y="78" class="sub">1 SLiM individual = 1 parasite genome; all ancestry kept in the tree sequence</text>

  <rect x="830" y="110" width="750" height="430" rx="28" fill="#f7eaf2" stroke="#c9606e" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="852" y="140" class="pl" fill="#b04d5c">in a human</text>

  <rect x="1316" y="150" width="226" height="70" rx="10" fill="#fff" stroke="#c9606e" stroke-width="2"/>
  <text x="1429" y="172" class="bx" text-anchor="middle">Inoculated genotype(s)</text>
  <text x="1429" y="190" class="ts" text-anchor="middle">k distinct lineages per bite</text>
  <text x="1429" y="208" class="new" text-anchor="middle">k = 1 at the default (&#955;_spz = 0)</text>

  <rect x="860" y="155" width="250" height="78" rx="10" fill="#fff" stroke="#c9606e" stroke-width="2"/>
  <text x="985" y="180" class="bx" text-anchor="middle">Blood-stage infection</text>
  <rect x="945" y="192" width="80" height="11" rx="3" fill="#d9a0d6" stroke="#8d6a8b" stroke-width="0.8"/>
  <text x="985" y="224" class="ts" text-anchor="middle">primary or relapse episode</text>

  <line x1="1314" y1="183" x2="1114" y2="183" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="1214" y="176" class="ts" text-anchor="middle">primary (P_PRIMARY = 1)</text>

  <rect x="1316" y="296" width="226" height="104" rx="10" fill="#fff" stroke="#c9606e" stroke-width="2"/>
  <text x="1429" y="318" class="bx" text-anchor="middle">Hypnozoite batch</text>
  <rect x="1352" y="328" width="50" height="8" rx="2" fill="#d9a0d6" stroke="#8d6a8b" stroke-width="0.6"/>
  <rect x="1352" y="339" width="50" height="8" rx="2" fill="#d9a0d6" stroke="#8d6a8b" stroke-width="0.6"/>
  <rect x="1352" y="350" width="50" height="8" rx="2" fill="#d9a0d6" stroke="#8d6a8b" stroke-width="0.6"/>
  <text x="1412" y="348" class="ts">&#215; n clonal</text>
  <text x="1429" y="376" class="ts" text-anchor="middle">n ~ Geom(mean &#957; = 5) ONE PER BITE,</text>
  <text x="1429" y="392" class="new" text-anchor="middle">split uniformly across the k genotypes</text>

  <line x1="1429" y1="222" x2="1429" y2="292" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="1439" y="250" class="ts">and / or</text>
  <text x="1439" y="265" class="ts">batch (if n &gt; 0)</text>

  <path d="M1314,335 C1230,330 1160,290 1112,215" fill="none" stroke="#c9606e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aP)"/>
  <text x="1262" y="262" class="t" text-anchor="middle" font-weight="600" style="fill:#b04d5c">relapse</text>
  <text x="1262" y="278" class="ts" text-anchor="middle" style="fill:#b04d5c">&#945; per hypnozoite;</text>
  <text x="1262" y="292" class="ts" text-anchor="middle" style="fill:#b04d5c">clone of batch (IBD = 1)</text>

  <line x1="1429" y1="402" x2="1429" y2="448" stroke="#b8912a" stroke-width="2" marker-end="url(#aY)"/>
  <text x="1429" y="470" font-size="20px" fill="#b8912a" text-anchor="middle" font-weight="700">&#10005;</text>
  <text x="1440" y="420" class="ts" style="fill:#8a6a14">death &#956;, age cap,</text>
  <text x="1440" y="434" class="ts" style="fill:#8a6a14">radical cure, MDA;</text>
  <text x="1440" y="448" class="new">batch retires at count 0</text>

  <line x1="890" y1="235" x2="890" y2="292" stroke="#b8912a" stroke-width="2" marker-end="url(#aY)"/>
  <text x="890" y="314" font-size="20px" fill="#b8912a" text-anchor="middle" font-weight="700">&#10005;</text>
  <text x="904" y="262" class="ts" style="fill:#8a6a14">cleared: natural</text>
  <text x="904" y="276" class="ts" style="fill:#8a6a14">(mean 60 d), case</text>
  <text x="904" y="290" class="ts" style="fill:#8a6a14">blood-stage tx, MDA</text>

  <line x1="1060" y1="235" x2="1060" y2="426" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="1050" y="348" class="ts" text-anchor="end">gametocytes after</text>
  <text x="1050" y="362" class="ts" text-anchor="end">delay, w.p. P_GAMETOCYTE</text>

  <rect x="938" y="430" width="224" height="74" rx="10" fill="#fff" stroke="#c9606e" stroke-width="2"/>
  <text x="1050" y="452" class="bx" text-anchor="middle">Gametocyte pool</text>
  <text x="1050" y="470" class="ts" text-anchor="middle">active lineages, gametocytaemic</text>
  <text x="1050" y="488" class="new" text-anchor="middle">Simpson P_out is LOGGED, not imposed</text>

  <rect x="1216" y="410" width="190" height="104" rx="10" fill="#f3f3f3" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="1311" y="432" class="bx" text-anchor="middle" style="fill:#555">Observation layer</text>
  <text x="1311" y="452" class="ts" text-anchor="middle">each episode detected</text>
  <text x="1311" y="467" class="ts" text-anchor="middle">w.p. P_DETECT (primary /</text>
  <text x="1311" y="482" class="ts" text-anchor="middle">relapse) &#8594; genotyped;</text>
  <text x="1311" y="497" class="ts" text-anchor="middle">can trigger treatment</text>
  <path d="M1112,237 C1150,320 1180,380 1212,430" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#aX)"/>

  <rect x="830" y="600" width="750" height="300" rx="28" fill="#edf4eb" stroke="#4f7a5e" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="852" y="630" class="pl" fill="#4f7a5e">in a mosquito</text>

  <line x1="1050" y1="506" x2="1050" y2="592" stroke="#c9606e" stroke-width="2.5" marker-end="url(#aP)"/>
  <text x="1062" y="556" class="t" style="fill:#b04d5c">uptake &#8594; n oocysts</text>
  <text x="1062" y="571" class="new">n ~ ZT Poisson(&#955;_ooc), NB if K &gt; 0</text>
  <text x="1062" y="586" class="new">each oocyst = its own meiosis</text>

  <rect x="860" y="646" width="470" height="134" rx="10" fill="#fff" stroke="#4f7a5e" stroke-width="2"/>
  <text x="1095" y="670" class="bx" text-anchor="middle">Per oocyst: 2 gametes drawn independently &amp; uniformly from the pool</text>
  <text x="1095" y="688" class="new" text-anchor="middle">selfing vs outcrossing EMERGES from the draw; P(i,j) &#8733; p&#7522;p&#11388; (Wong et al. 2018)</text>

  <text x="952" y="712" class="ts" text-anchor="middle">same lineage &#8594; selfed</text>
  <rect x="912" y="722" width="80" height="11" rx="3" fill="#d9a0d6" stroke="#8d6a8b" stroke-width="0.8"/>
  <text x="952" y="752" class="ts" text-anchor="middle">1 object, spz_weight 4</text>
  <text x="952" y="768" class="new" text-anchor="middle">(stands for 4 identical products)</text>

  <text x="1200" y="712" class="ts" text-anchor="middle">different lineages &#8594; outcrossed tetrad</text>
  <rect x="1115" y="722" width="80" height="10" rx="3" fill="#e6c04a" stroke="#9a7d25" stroke-width="0.8"/>
  <rect x="1205" y="722" width="80" height="10" rx="3" fill="#c0322b" stroke="#7d1f1a" stroke-width="0.8"/>
  <g stroke-width="0.8">
    <rect x="1115" y="738" width="80" height="10" rx="3" fill="#e6c04a" stroke="#9a7d25"/>
    <rect x="1155" y="738" width="40" height="10" fill="#c0322b" stroke="#7d1f1a"/>
    <rect x="1205" y="738" width="80" height="10" rx="3" fill="#c0322b" stroke="#7d1f1a"/>
    <rect x="1245" y="738" width="40" height="10" fill="#e6c04a" stroke="#9a7d25"/>
  </g>
  <text x="1200" y="768" class="ts" text-anchor="middle">2 parental clones + 2 reciprocal recombinants</text>

  <rect x="1360" y="646" width="200" height="134" rx="10" fill="#fff" stroke="#4f7a5e" stroke-width="2"/>
  <text x="1460" y="670" class="bx" text-anchor="middle">Transmissible pool</text>
  <text x="1460" y="690" class="ts" text-anchor="middle">all products past the EIP</text>
  <text x="1460" y="710" class="ts" text-anchor="middle">bite draws n ~ ZT(&#955;_spz),</text>
  <text x="1460" y="726" class="ts" text-anchor="middle">weighted by spz_weight,</text>
  <text x="1460" y="742" class="ts" text-anchor="middle">repeats collapsed to</text>
  <text x="1460" y="758" class="ts" text-anchor="middle">distinct lineages</text>
  <text x="1460" y="774" class="new" text-anchor="middle">&#955;_spz = 0 &#8594; exactly 1</text>

  <line x1="1332" y1="700" x2="1356" y2="700" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>
  <text x="1210" y="862" class="t" text-anchor="middle">EIP (fixed 10 d); mosquito death removes all its broods</text>
  <path d="M1095,782 C1095,840 1430,846 1450,784" fill="none" stroke="#555" stroke-width="2" marker-end="url(#aD)"/>

  <path d="M1570,644 L1570,183 L1546,183" fill="none" stroke="#4f7a5e" stroke-width="2.5" marker-end="url(#aG)"/>
  <text x="1560" y="580" class="t" text-anchor="end" style="fill:#4f7a5e">inoculation</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="40" y="930" font-size="13px" fill="#8a6a14"><tspan font-weight="700">Interventions:</tspan> vector control &amp; seasonality scale biting (&#955;<tspan font-size="10px" dy="3">h</tspan><tspan dy="-3">, &#955;</tspan><tspan font-size="10px" dy="3">v</tspan><tspan dy="-3">, and &#953;); case-based blood-stage treatment &#8594; recovery; case-based radical cure &amp; MDA &#8594; reservoir cleared (MDA also clears blood stage).</tspan></text>
  <text x="40" y="952" class="ti">Genome: 14 PvP01 chromosomes as ONE linkage group, r = 0.5 at the 13 junctions (independent assortment), 7.4e-7/bp within chromosomes. Mutation rate is ZERO - the genome is a neutral scaffold and all</text>
  <text x="40" y="970" class="ti">genetics come from the recorded genealogy; alleles are painted on downstream. Ground-truth IBD is read from the tree sequence, never inferred from markers.</text>
  <text x="40" y="994" class="new">Purple annotations mark behaviour introduced or corrected in v0.1.0 (WS-F uptake model, WS-G batch retirement, emergent outcrossing, per-bite hypnozoite batch).</text>
</svg>
