url: https://shaziaruybal.github.io/malariafwd/

template:
  bootstrap: 5

reference:
- title: Running simulations
  desc: Build a parameter set, run the model, sweep in parallel.
  contents: [vivax_params, as_slim_args, run_sim, run_grid,
             slim_available, slim_version, slim_path, slim_model]

- title: Loading a run
  desc: Tidy accessors for the files a run writes.
  contents: [load_run, load_events, load_state, load_params, trees_path,
             model_version, event_types]

- title: Diagnostics
  desc: Is this run healthy, and what is driving it?
  contents: [plot_diagnostics, summarise_run, force_of_infection,
             plot_force_of_infection, theme_malariafwd]

- title: Epidemiology
  desc: Cases by origin, transmission chains, and the surveillance view.
  contents: [classify_cases, incidence_by_origin, host_state_prevalence,
             coi_distribution, transmission_links, rc_by_origin, transmission_chains,
             classify_who, pick_host]

- title: Hypnozoites and relapses
  desc: The latent reservoir and the recurrences it drives.
  contents: [reservoir_trajectory, relapse_fraction, relapses_per_person_year,
             dormancy_durations, time_to_relapse, moi_vs_relapse]

- title: Relatedness (IBD)
  desc: Ground-truth identity-by-descent from the recorded genealogy.
  contents: [ibd_pairs, ibd_index, ibd_segments, chrom_map, ibd_truth_pairs,
             ibd_trajectory, ibd_relapse_origin, new_infection_diversity]

- title: The ARG
  desc: >
    Tree/branch-domain views. The model is neutral, so site statistics are all zero and
    branch mode is the right tool - but the genealogy is a forest, so read ?arg_summary first.
  contents: [arg_summary, arg_tmrca, arg_diversity, arg_divergence]

- title: Calibrating the uptake draws
  desc: LAMBDA_* is a pre-truncation rate, not a mean count.
  contents: [uptake_moments, uptake_calibrate]

- title: Plots
  contents: [plot_ibd_pair, plot_relatedness_ladder, plot_host_trajectory,
             plot_host_state_prevalence, plot_relapse_km, plot_moi_vs_relapse]

- title: Package
  contents: [malariafwd-package]

articles:
- title: Get started
  navbar: ~
  contents: [malariafwd, anatomy]
