url: https://shaziaruybal.github.io/malariafwd/

template:
  bootstrap: 5

reference:
- title: Start here
  desc: The terms used across the package, a run to try them on, and where to read more.
  contents: [malariafwd-package, example_run]

- title: Running simulations
  desc: Build a parameter set, run the model, sweep in parallel.
  contents: [vivax_params, param_info, run_sim, run_grid, load_grid, check_setup, tskit_available,
             slim_available, slim_version, slim_model]

- title: Loading a run
  desc: Tidy accessors for the files a run writes.
  contents: [load_run, load_events, load_state, load_params, trees_path,
             event_types, malariafwd-outputs]

- title: Diagnostics
  desc: Is this run healthy, and what is driving it?
  contents: [plot_diagnostics, summarise_run, force_of_infection,
             plot_force_of_infection]

- title: Genotype data
  desc: Marker genotypes painted on the run's genealogy, and their VCF.
  contents: [simulate_genotypes, write_vcf]

- title: Epidemiology
  desc: Cases by origin, transmission chains, and the surveillance view.
  contents: [classify_cases, episodes, recurrences, classify_chain, host_state_prevalence,
             coi_distribution, transmission_links, rc_by_origin, classify_travel]

- title: Hypnozoites and relapses
  desc: The latent reservoir and the recurrences it drives.
  contents: [relapse_fraction, dormancy_durations, time_to_relapse]

- title: Relatedness (IBD)
  desc: Ground-truth identity-by-descent from the recorded genealogy.
  contents: [ibd_pairs, ibd_lookup, ibd_segments, chrom_map, ibd_truth_pairs,
             new_infection_diversity]

- title: The ARG
  desc: >
    Tree-domain views of the genealogy, which is a forest: read ?arg_summary first, and use
    arg_tmrca() for relatedness.
  contents: [arg_summary, arg_tmrca]

- title: Calibrating the uptake draws
  desc: LAMBDA_* is a pre-truncation rate, not a mean count.
  contents: [uptake_moments, uptake_calibrate]

- title: Plots
  contents: [plot_ibd_pair, plot_relatedness_ladder, plot_host_trajectory,
             plot_host_state_prevalence, plot_relapse_km]

articles:
- title: Get started
  navbar: ~
  contents: [malariafwd, anatomy]
